version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres_spark_lab
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bigdata_store
    ports:
      - "5433:5432"
    volumes:
      - postgres_spark_data:/var/lib/postgresql/data
      - ./pg_init_scripts:/docker-entrypoint-initdb.d
      - ./data:/data_import
    networks:
      - app_network
    restart: unless-stopped

  spark-master:
    image: bitnami/spark:3.5
    container_name: spark_master_lab
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark_apps:/opt/spark_apps
      - ./drivers:/opt/spark/jars-custom
    networks:
      - app_network
    restart: unless-stopped

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark_worker_lab
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark_apps:/opt/spark_apps
      - ./drivers:/opt/spark/jars-custom
    depends_on:
      - spark-master
    networks:
      - app_network
    restart: unless-stopped

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter_lab_spark
    ports:
      - "8889:8888"
      - "4040:4040"
    environment:
      - JUPYTER_TOKEN=sparklab
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - ./spark_apps:/home/jovyan/work
      - ./drivers:/home/jovyan/drivers
    depends_on:
      - spark-master
    networks:
      - app_network
    restart: unless-stopped
    command: >
      start-notebook.sh --NotebookApp.token='sparklab'
      --SparkLauncher.master='spark://spark-master:7077'
      --load_extensions.pyspark='--jars /home/jovyan/drivers/postgresql.jar,/home/jovyan/drivers/clickhouse.jar'

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_lab
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_spark_data:/var/lib/clickhouse
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_spark_data:
  clickhouse_spark_data:

networks:
  app_network:
    driver: bridge